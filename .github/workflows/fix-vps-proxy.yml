name: Fix VPS proxy

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and restart nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 3m
          script: |
            set -eu
            echo "=== listeners before ==="
            ss -lntp | grep -E ':80|:443|:8080' || true
            echo "=== nginx status ==="
            systemctl is-active nginx || true
            systemctl is-failed nginx || true
            journalctl -u nginx -n 40 --no-pager || true
            echo "=== nginx -t ==="
            nginx -t || true
            echo "=== sites ==="
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            ls -la /etc/nginx/conf.d/ 2>/dev/null || true
            echo "=== restart nginx ==="
            systemctl reset-failed nginx || true
            systemctl restart nginx
            sleep 2
            systemctl --no-pager --full status nginx || true
            echo "=== listeners after ==="
            ss -lntp | grep -E ':80|:443|:8080' || true
            echo "=== health via nginx ==="
            curl -fsS http://127.0.0.1/health || true
            echo
            curl -kfsS https://127.0.0.1/health || true
            echo
            curl -fsS http://127.0.0.1:8080/health
            echo
