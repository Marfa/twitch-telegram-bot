name: Backfill bot_blocked_at

on:
  workflow_dispatch:

permissions: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Set bot_blocked_at from PostHog
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            docker compose -f compose.vps.yml exec -T bot python - <<'PY'
            import runpy
            runpy.run_path("/app/scripts/backfill-bot-blocked-at.py", run_name="__main__")
            PY
