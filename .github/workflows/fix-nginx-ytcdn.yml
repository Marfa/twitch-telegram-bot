name: Fix nginx ytcdn

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install hardened freshrss-ytcdn.conf
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 2m
          script: |
            set -eu
            SNIP=/etc/nginx/snippets/freshrss-ytcdn.conf
            cp -a "$SNIP" "${SNIP}.bak.$(date +%s)"
            echo '' | base64 -d > "$SNIP"
            echo "=== installed ==="
            cat "$SNIP"
            nginx -t
            systemctl reload nginx
            systemctl is-active nginx
            curl -fsS https://bot.themarfa.name/health
            echo
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 "https://feeds.themarfa.name/ytcdn/i/vi/dQw4w9WgXcQ/hqdefault.jpg" || echo fail)
            echo "ytcdn_smoke=$code"
