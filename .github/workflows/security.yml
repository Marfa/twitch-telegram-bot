name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements.txt
        # Non-zero exit if any known vulnerability is found.
        run: pip-audit -r requirements.txt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Value-based: fails if a tracked .env* slipped in (CI has no secrets .env).
  # Local pre-commit uses real .env values via scripts/pre-commit-gitleaks.sh.
  omerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - name: omerta check (tracked files)
        run: uvx omerta@0.1.2 check --all
      - name: omerta history
        run: uvx omerta@0.1.2 history
