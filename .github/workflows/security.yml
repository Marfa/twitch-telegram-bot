name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements.txt
        # Non-zero exit if any known vulnerability is found.
        run: pip-audit -r requirements.txt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Value-based leak scan. Encrypted dotenvx `.env` is intentionally tracked —
  # hide it for omerta's "tracked env file" gate (ciphertext is not a value source).
  # Local pre-commit: scripts/pre-commit-gitleaks.sh (+ optional .env.local).
  omerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No floating major tag (v10); pin a release. See astral-sh/setup-uv releases.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: omerta check (tracked files)
        run: |
          set -euo pipefail
          if [[ -f .env ]]; then
            mv .env /tmp/dotenvx-ciphertext.env
          fi
          uvx omerta@0.1.2 check --all
          if [[ -f /tmp/dotenvx-ciphertext.env ]]; then
            mv /tmp/dotenvx-ciphertext.env .env
          fi
      - name: omerta history
        run: |
          set -euo pipefail
          if [[ -f .env ]]; then
            mv .env /tmp/dotenvx-ciphertext.env
          fi
          uvx omerta@0.1.2 history
          if [[ -f /tmp/dotenvx-ciphertext.env ]]; then
            mv /tmp/dotenvx-ciphertext.env .env
          fi
