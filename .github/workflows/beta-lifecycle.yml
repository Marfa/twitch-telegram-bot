name: Beta lifecycle

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

concurrency:
  group: beta-lifecycle
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Promote ready beta features
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/beta-lifecycle.py

      - name: Commit GA promotion (manifest + stripped beta doc marks)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add beta/manifest.json README.md README.en.md docs/user-flow-map.ru.md webapp/guide/
          if git diff --cached --quiet; then
            echo "No lifecycle changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote beta features to GA"
          git push
          # GITHUB_TOKEN pushes do not trigger other workflows; deploy explicitly.
          gh workflow run deploy-vps.yml --repo "$GH_REPO"
