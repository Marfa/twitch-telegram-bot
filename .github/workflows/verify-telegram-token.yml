name: Verify Telegram bot token

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: getMe against VPS .env token
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            python3 - <<'PY'
            import json, pathlib, re, urllib.request
            text = pathlib.Path(".env").read_text(encoding="utf-8")
            m = re.search(r"^TELEGRAM_BOT_TOKEN=(.+)$", text, re.M)
            if not m:
                raise SystemExit("TELEGRAM_BOT_TOKEN missing in VPS .env")
            tok = m.group(1).strip().strip('"').strip("'")
            bot_id = tok.split(":", 1)[0]
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/getMe")
            try:
                with urllib.request.urlopen(req, timeout=20) as resp:
                    data = json.load(resp)
            except Exception as exc:
                print(f"getMe_failed bot_id={bot_id} err={type(exc).__name__}")
                raise SystemExit(1) from exc
            ok = bool(data.get("ok"))
            res = data.get("result") or {}
            print(
                f"getMe_ok={ok} bot_id={bot_id} api_id={res.get('id')} "
                f"username={res.get('username')}"
            )
            if not ok or str(res.get("id")) != str(bot_id):
                raise SystemExit(1)
            PY
