# Temporary: seed curated aipchat. Remove after run.
name: Sync streamer TG links

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Seed curated aipchat on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            docker compose -f compose.vps.yml exec -T db \
              psql -U bot -d bot -c "
            INSERT INTO streamer_telegram_links (twitch_login, url, source)
            VALUES ('marfapr', 'https://t.me/aipchat', 'curated')
            ON CONFLICT (twitch_login, url, source) DO UPDATE SET updated_at = NOW();
            SELECT DISTINCT url FROM streamer_telegram_links
            WHERE twitch_login = 'marfapr' ORDER BY url;
            "
