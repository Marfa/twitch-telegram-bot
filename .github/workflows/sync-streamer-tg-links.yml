# Ops: backfill streamer_telegram_links on VPS (run after Deploy has the new code).
name: Sync streamer TG links

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            docker compose -f compose.vps.yml cp \
              scripts/sync-streamer-telegram-links.py bot:/tmp/sync_streamer_tg.py
            docker compose -f compose.vps.yml exec -T bot \
              python /tmp/sync_streamer_tg.py
            docker compose -f compose.vps.yml exec -T bot \
              rm -f /tmp/sync_streamer_tg.py
