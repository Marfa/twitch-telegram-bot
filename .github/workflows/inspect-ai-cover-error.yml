name: Inspect AI cover error

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Full AI cover traceback + live BotHub smoke
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 4m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            echo "=== full traceback around AI cover fail ==="
            docker compose -f compose.vps.yml logs --since 2h bot 2>&1 \
              | grep -A40 'AI cover generation failed for sub 88' | head -80 || true
            echo "=== BotHub smoke (tiny prompt) ==="
            docker compose -f compose.vps.yml exec -T bot python - <<'PY'
            import traceback
            import bothub
            try:
                raw = bothub.generate_cover_image(
                    "Solid deep blue abstract gradient, no text, widescreen 16:9."
                )
                print("ok bytes", len(raw or b""), "head", (raw or b"")[:16].hex())
            except Exception:
                traceback.print_exc()
            PY
