name: Pause blocked/unreachable delivery

on:
  workflow_dispatch:

permissions: {}

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Pause delivery for blocked users and unreachable chats
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            docker compose -f compose.vps.yml exec -T bot python scripts/pause-blocked-unreachable-delivery.py
