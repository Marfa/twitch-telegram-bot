name: Debug chelovekgleb preview

on:
  workflow_dispatch:

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query + logs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/twitch-telegram-bot
            docker compose -f compose.vps.yml exec -T db psql -U bot -d bot -v ON_ERROR_STOP=1 <<'SQL'
            SELECT s.id, s.owner_id, s.dest_type, s.chat_id, s.last_message_id,
                   s.image_file_id, s.image_position, s.enabled, s.twitch_username,
                   s.twitch_user_id
            FROM subscriptions s
            WHERE s.twitch_username ILIKE 'chelovekgleb'
              AND s.owner_id = 150697169
            ORDER BY s.id;
            SELECT id, login FROM twitch_users WHERE login ILIKE 'chelovekgleb' LIMIT 5;
            SQL
            echo "=== refresh logs ==="
            docker compose -f compose.vps.yml logs --since 3h bot 2>&1 \
              | grep -iE 'Stream preview|chelovekgleb|uneditable|editMessageMedia|preview refresh' \
              | tail -n 80 || true
