name: Sync paymentbot VPS secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy VPS secrets to paymentbot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          gh secret set VPS_HOST --repo Marfa/paymentbot --body "$VPS_HOST"
          gh secret set VPS_USER --repo Marfa/paymentbot --body "$VPS_USER"
          printf '%s' "$VPS_SSH_KEY" | gh secret set VPS_SSH_KEY --repo Marfa/paymentbot
