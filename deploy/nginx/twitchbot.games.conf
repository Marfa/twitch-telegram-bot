# Working VPS nginx vhost for twitchbot.games (Phase A).
# Live path: /etc/nginx/sites-available/twitchbot (symlink in sites-enabled).
# Rate-limit zones: /etc/nginx/conf.d/bot-app-rate-limit.conf
# Cloudflare real_ip: /etc/nginx/conf.d/cloudflare-real-ip.conf
#
# Apply on VPS (DNS-only / grey cloud first — HTTP-01 certbot):
#   1) copy cloudflare-real-ip.conf + bot-app-rate-limit.conf to /etc/nginx/conf.d/
#   2) install this file as /etc/nginx/sites-available/twitchbot
#   3) ln -sf ../sites-available/twitchbot /etc/nginx/sites-enabled/twitchbot
#   4) nginx -t && nginx -s reload
#   5) certbot --nginx -d twitchbot.games -d www.twitchbot.games
#   6) then orange-cloud DNS + SSL Full (strict) + Cache Bypass in Cloudflare
#
# After cutover, keep bot.themarfa.name vhost as 301 → https://twitchbot.games$request_uri
#
# Do not rate-limit /health or /health/c/* (PingZen). Leave /hooks/, /webhook,
# /oauth/, /media/, /assets/* on the catch-all location / without limit_req.

# --- apex HTTPS (Certbot will add listen 443 ssl + certificate lines) ---
server {
    server_name twitchbot.games;

    limit_req_status 429;
    limit_req_log_level warn;

    location /app/chat/api/ {
        limit_req zone=app_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /app/ {
        limit_req zone=app_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twitchbot.games/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twitchbot.games/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# --- www → apex ---
server {
    server_name www.twitchbot.games;
    return 301 https://twitchbot.games$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twitchbot.games/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twitchbot.games/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = twitchbot.games) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name twitchbot.games;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
server {
    if ($host = www.twitchbot.games) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.twitchbot.games;
    return 404; # managed by Certbot


}