# Working VPS nginx vhost for bot.themarfa.name (as of 2026-11-23).
# Live path: /etc/nginx/sites-available/bot (symlink in sites-enabled).
# Rate-limit zones live in /etc/nginx/conf.d/bot-app-rate-limit.conf
# (must be included from http {} — see snippet below).
#
# Apply on VPS:
#   1) copy zones file to /etc/nginx/conf.d/bot-app-rate-limit.conf
#   2) install this file as /etc/nginx/sites-available/bot (keep Certbot SSL lines)
#   3) nginx -t && nginx -s reload
#
# Do not rate-limit /health or /health/c/* (PingZen). Leave /hooks/, /webhook,
# /oauth/, /media/, /assets/* on the catch-all location / without limit_req.

# --- /etc/nginx/conf.d/bot-app-rate-limit.conf ---
# limit_req_zone $binary_remote_addr zone=app_chat:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=app_api:10m rate=2r/s;

server {
    server_name bot.themarfa.name;

    limit_req_status 429;
    limit_req_log_level warn;

    location /app/chat/api/ {
        limit_req zone=app_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /app/ {
        limit_req zone=app_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bot.themarfa.name/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bot.themarfa.name/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bot.themarfa.name) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bot.themarfa.name;
    return 404; # managed by Certbot
}
