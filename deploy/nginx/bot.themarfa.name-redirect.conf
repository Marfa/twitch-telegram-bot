# After Phase A cutover: keep TLS on bot.themarfa.name, redirect all paths
# to the canonical origin. Live: replace /etc/nginx/sites-available/bot
# (or add a dedicated redirect server) — keep Certbot SSL lines for the old host.
#
# server {
#     listen 443 ssl;
#     server_name bot.themarfa.name;
#     ssl_certificate     /etc/letsencrypt/live/bot.themarfa.name/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/bot.themarfa.name/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     return 301 https://twitchbot.games$request_uri;
# }
#
# server {
#     listen 80;
#     server_name bot.themarfa.name;
#     return 301 https://twitchbot.games$request_uri;
# }

server {
    listen 443 ssl;
    server_name bot.themarfa.name;

    ssl_certificate /etc/letsencrypt/live/bot.themarfa.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.themarfa.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://twitchbot.games$request_uri;
}

server {
    listen 80;
    server_name bot.themarfa.name;
    return 301 https://twitchbot.games$request_uri;
}
