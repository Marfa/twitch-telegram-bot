# Values from untracked .env / .env.local — not templates (*.example are skipped as sources).
env-files = [".env", ".env.local"]

# Non-secrets that intentionally appear in docs/compose/config defaults.
ignore = [
  "PUBLIC_BASE_URL",
  "DATABASE_PATH",
  "DATABASE_URL",
  "AZURE_TRANSLATOR_REGION",
  "AZURE_TRANSLATOR_ENDPOINT",
  "BOTHUB_BASE_URL",
  "BOTHUB_IMAGE_MODEL",
  "BOTHUB_IMAGE_MODEL_FALLBACK",
  "POSTHOG_HOST",
  "FEATURE_IDS",
  "PREMIUM_TWITCH_LOGIN",
  "STREAM_PREVIEW_REFRESH_SECONDS",
  "MAX_SUBSCRIPTIONS_PER_OWNER",
  "REFERRAL_COMMISSION_PERCENT",
  "REFERRAL_WITHDRAW_MIN_STARS",
  "PREMIUM_FREE_ACTIVE_LIMIT",
  "PREMIUM_STARS_AMOUNT",
  "PREMIUM_STARS_YEAR",
  "PREMIUM_STARS_LIFETIME",
  "PREMIUM_STARS_FEATURE",
  "PREMIUM_CHANNEL_STARS",
  "PREMIUM_TRIAL_DAYS",
  "PREMIUM_SUBSCRIPTION_PERIOD",
  "CHECK_INTERVAL",
  "SCHEDULE_CHECK_INTERVAL",
  "PORT",
  "ENABLE_PREMIUM",
  "ENABLE_HELP",
  "ENABLE_PARTNER",
  "VPS_HOST",
  "VPS_USER",
]
