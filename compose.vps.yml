services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    volumes:
      - pg-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: "0.50"
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD}@db:5432/bot?sslmode=disable
      DATABASE_PATH: /data/bot.db
    volumes:
      - bot-data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    mem_limit: 512m
    cpus: "0.75"
    restart: unless-stopped
    stop_grace_period: 25s

volumes:
  bot-data:
  pg-data-18:
